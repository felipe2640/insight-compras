openapi: 3.1.0
info:
  title: Cotação Hub API
  version: 1.0.0-draft
  description: |
    Contrato pré-G0 de uma plataforma multi-tenant independente. IDs externos são opacos.
    O tenant e o ator são derivados do token; parâmetros de corpo nunca selecionam tenant.
    Dinheiro e quantidade são strings decimais, sem expoente, com até seis casas.
    Datas são UTC. Mutação exige Idempotency-Key; mutação de recurso existente exige If-Match.
    A chave idempotente é retida por ao menos 72 horas por tenant, ator/aplicação,
    método e caminho; repetição com mesmo corpo devolve a resposta original e corpo
    diferente devolve 409. ETag é uma versão opaca, inclusive em respostas de leitura.
    Comandos são serializados no servidor: uma resposta que chega após fechamento
    falha com 409, mesmo se o cliente alegar timestamp anterior.
    Limites iniciais: 100 itens por página, 1000 itens por cotação, 500 linhas por bulk,
    XLSX até 10 MiB e 10000 linhas; excesso retorna 413 ou 422.
    Bootstrap de tenant, credenciais e namespace de origem é provisionamento público
    administrativo, documentado fora desta API de operação; não requer banco compartilhado.
    Supplier machine-to-machine está fora do MVP e não é aceito em /api/v1.
    Apenas sessões individuais do fornecedor, vinculadas a participação ou pedido,
    autorizam os endpoints supplier. TrustedIdentityProvider é configuração do Hub
    com provider_id, type (oidc, jwt_jwks, hub_session), issuer, audience, JWKS/key
    source, tenant/subject/role mappings, enabled e policy_version; nenhuma identidade
    passada em header ou corpo é confiável sem verificação criptográfica.
    Defaults pré-produção: sugestão de convite 7 dias na UI (API exige expires_at,
    máximo 30 dias), OTP 5 min, 5 tentativas, reenvio após 60 s,
    sessão supplier 30 min ociosa/12 h absoluta e buyer federada 30 min ociosa/8 h absoluta,
    URL assinada de documento 5 min, webhook replay window 5 min.
    Rate limits por IP, identidade, tenant, convite e aplicação são cumulativos;
    valores iniciais e política de revisão constam da specification canônica.
servers:
  - url: https://api.cotacao-hub.example
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Suppliers
  - name: Quotations
  - name: Supplier portal
  - name: Imports
  - name: Award
  - name: Purchasing
  - name: Integrations
paths:
  /api/v1/oauth/token:
    post:
      operationId: post_oauth_token
      tags: [Authentication]
      summary: Obter token machine-to-machine
      description: Credencial de aplicação é vinculada a um único tenant e a escopos concedidos.
      security:
        - clientBasic: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [grant_type]
              properties:
                grant_type: {type: string, const: client_credentials}
                scope: {type: string, example: 'supplier:manage quotation:write quotation:manage invitation:write award:write award:approve order:write order:issue integration:manage'}
      responses:
        '200':
          description: Token curto para a API
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, scope]
                properties:
                  access_token: {type: string}
                  token_type: {type: string, const: Bearer}
                  expires_in: {type: integer, example: 900}
                  scope: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/sso/launches:
    post:
      operationId: post_sso_launches
      tags: [Authentication]
      summary: Criar abertura autenticada do portal buyer
      description: |
        Alternativas: sessão buyer própria do Hub com portal:launch; ou credencial
        de aplicação vinculada ao tenant mais asserção Bearer de TrustedIdentityProvider
        registrado. A segunda alternativa exige ambos os esquemas. Hub verifica
        assinatura, issuer, audience, expiração, subject, jti/nonce de uso único,
        mapeamento de tenant e papéis, e igualdade com o tenant da aplicação.
        return_url deve constar da allowlist registrada do host. Nunca aceita
        tenant_id informado pelo host como prova.
      security:
        - hubBuyerSession: []
        - bearerAuth: [portal:launch]
          trustedIdentityAssertion: []
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quotation_id]
              properties:
                quotation_id: {$ref: '#/components/schemas/Id'}
                return_url: {type: string, format: uri}
      responses:
        '201':
          description: URL de abertura de uso único e vida curta
          content:
            application/json:
              schema:
                type: object
                required: [launch_url, expires_at]
                properties:
                  launch_url: {type: string, format: uri}
                  expires_at: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/suppliers:
    get:
      operationId: get_suppliers
      tags: [Suppliers]
      summary: Listar relações visíveis ao tenant
      security: [{bearerAuth: ['supplier:read']}]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Página de relações privadas
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/SupplierRelationship'}}
                  next_cursor: {type: [string, 'null']}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: post_suppliers
      tags: [Suppliers]
      summary: Criar ou associar fornecedor ao tenant sem revelar outro buyer
      description: Resposta não indica se organização global preexistia; CNPJ não concede representação.
      security: [{bearerAuth: ['supplier:manage']}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SupplierCreate'}
            example:
              legal_name: Distribuidora Aurora Ltda
              tax_identifier: '00000000000191'
              contacts: [{name: Ana, email: ana@aurora.example, phone: '+5511999990001'}]
              external_refs: [{source_system: cliente-terceiro, external_id: FORN-001}]
      responses:
        '201':
          description: Relação criada
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/SupplierRelationship'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/suppliers/{supplierId}/relationship:
    get:
      operationId: get_suppliers_supplierId_relationship
      tags: [Suppliers]
      summary: Consultar relação privada
      security: [{bearerAuth: ['supplier:read']}]
      parameters: [{$ref: '#/components/parameters/SupplierId'}]
      responses:
        '200':
          description: Relação do tenant autenticado
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/SupplierRelationship'}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      operationId: put_suppliers_supplierId_relationship
      tags: [Suppliers]
      summary: Atualizar dados privados do vínculo comercial
      security: [{bearerAuth: ['supplier:manage']}]
      parameters: [{$ref: '#/components/parameters/SupplierId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SupplierRelationshipUpdate'}}}
      responses:
        '200':
          description: Relação atualizada
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/SupplierRelationship'}}}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/quotations:
    get:
      operationId: get_quotations
      tags: [Quotations]
      summary: Listar cotações do tenant
      security: [{bearerAuth: ['quotation:read']}]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {name: status, in: query, schema: {$ref: '#/components/schemas/QuotationStatus'}}]
      responses:
        '200':
          description: Página
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Quotation'}}
                  next_cursor: {type: [string, 'null']}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: post_quotations
      tags: [Quotations]
      summary: Criar cotação com snapshots de itens e destino
      security: [{bearerAuth: ['quotation:write']}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuotationCreate'}
            example:
              source_system: cliente-terceiro
              external_id: COT-OPAQUE-1
              currency: BRL
              response_deadline_at: '2026-10-10T18:00:00Z'
              buyer_snapshot: {name: Compradora Exemplo Ltda, tax_identifier: '11111111000191'}
              destinations: [{external_id: LOJA-A, name: Filial A, address: Rua Exemplo 1}]
              items:
                - {external_id: ITEM-1, description: Bucha de suspensão, requested_reference: REF-X, requested_brand: MARCA-X, requested_quantity: '7.000000', requested_unit: peça, destination_external_id: LOJA-A}
      responses:
        '201':
          description: Cotação em rascunho
          headers: {ETag: {$ref: '#/components/headers/ETag'}, Location: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Quotation'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/quotations/{quotationId}:
    get:
      operationId: get_quotations_quotationId
      tags: [Quotations]
      summary: Consultar cotação
      security: [{bearerAuth: ['quotation:read']}]
      parameters: [{$ref: '#/components/parameters/QuotationId'}]
      responses:
        '200':
          description: Snapshot atual
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Quotation'}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/quotations/{quotationId}/items:bulk:
    post:
      operationId: post_quotations_quotationId_items_bulk
      tags: [Quotations]
      summary: Adicionar ou substituir itens em rascunho em uma operação atômica
      description: Até 500 linhas; valida tudo antes de gravar. IDs externos não são FKs.
      security: [{bearerAuth: ['quotation:write']}]
      parameters: [{$ref: '#/components/parameters/QuotationId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode, items]
              properties:
                mode: {type: string, enum: [append, replace]}
                items: {type: array, minItems: 1, maxItems: 500, items: {$ref: '#/components/schemas/QuotationItemInput'}}
      responses:
        '200':
          description: Cotação atualizada
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Quotation'}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/quotations/{quotationId}:open:
    post:
      operationId: post_quotations_quotationId_open
      tags: [Quotations]
      summary: Abrir cotação para respostas
      security: [{bearerAuth: ['quotation:manage']}]
      parameters: [{$ref: '#/components/parameters/QuotationId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      responses:
        '200': {$ref: '#/components/responses/QuotationChanged'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/quotations/{quotationId}:close:
    post:
      operationId: post_quotations_quotationId_close
      tags: [Quotations]
      summary: Fechar respostas e congelar revisões submetidas
      security: [{bearerAuth: ['quotation:manage']}]
      parameters: [{$ref: '#/components/parameters/QuotationId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      responses:
        '200': {$ref: '#/components/responses/QuotationChanged'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/quotations/{quotationId}:reopen:
    post:
      operationId: post_quotations_quotationId_reopen
      tags: [Quotations]
      summary: Reabrir cotação fechada com revisão explícita
      description: |
        Operação atômica. Supersede o award vigente e cancela/supersede todos os
        pedidos draft vinculados antes de reabrir. Se qualquer pedido estiver issued
        ou em estado posterior, retorna 409 quotation_has_issued_orders. Corridas
        com emissão de pedido são serializadas pela versão da cotação; só uma vence.
      security: [{bearerAuth: ['quotation:manage']}]
      parameters: [{$ref: '#/components/parameters/QuotationId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [reason], properties: {reason: {type: string, minLength: 3, maxLength: 2000}}}}}
      responses:
        '200': {$ref: '#/components/responses/QuotationChanged'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/quotations/{quotationId}/invitations:
    post:
      operationId: post_quotations_quotationId_invitations
      tags: [Quotations]
      summary: Convidar destinatários para uma participação supplier
      description: Convite não cria membership global; manual_link só retorna uma vez.
      security: [{bearerAuth: ['invitation:write']}]
      parameters: [{$ref: '#/components/parameters/QuotationId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/InvitationCreate'}}}
      responses:
        '201':
          description: Convites restritos à cotação
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/InvitationResult'}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/supplier/invitations:redeem:
    post:
      operationId: post_supplier_invitations_redeem
      tags: [Supplier portal]
      summary: Resgatar convite apenas para seu contexto explícito
      security: []
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties: {token: {type: string, minLength: 32}}
      responses:
        '200':
          description: Contexto mínimo e sem sessão de escrita
          content: {application/json: {schema: {$ref: '#/components/schemas/InvitationContext'}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/supplier/auth/challenges:
    post:
      operationId: post_supplier_auth_challenges
      tags: [Supplier portal]
      summary: Enviar OTP individual ao canal associado ao convite
      security: []
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_context_id, channel]
              properties:
                challenge_context_id: {$ref: '#/components/schemas/Id'}
                channel: {type: string, enum: [email, phone]}
      responses:
        '202':
          description: Resposta uniforme para evitar enumeração
          content: {application/json: {schema: {$ref: '#/components/schemas/Challenge'}}}
        '429': {$ref: '#/components/responses/RateLimited'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/supplier/auth/challenges/{challengeId}:verify:
    post:
      operationId: post_supplier_auth_challenges_challengeId_verify
      tags: [Supplier portal]
      summary: Verificar OTP e criar sessão individual restrita
      security: []
      parameters: [{name: challengeId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties: {code: {type: string, minLength: 6, maxLength: 12}}
      responses:
        '200':
          description: Sessão só da participação e ações concedidas
          content: {application/json: {schema: {$ref: '#/components/schemas/SupplierSession'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '410': {$ref: '#/components/responses/Gone'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/supplier/auth/order-challenges:
    post:
      operationId: post_supplier_auth_order_challenges
      tags: [Supplier portal]
      summary: Solicitar autenticação individual para um pedido emitido
      description: Exige contexto de convite específico do pedido ou membership com papel de resposta. Convite de cotação não concede este acesso.
      security: []
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [order_invitation_context_id]
              properties:
                order_invitation_context_id: {$ref: '#/components/schemas/Id'}
      responses:
        '202':
          description: Resposta uniforme; verificar pelo endpoint de desafios
          content: {application/json: {schema: {$ref: '#/components/schemas/Challenge'}}}
        '429': {$ref: '#/components/responses/RateLimited'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/supplier/order-invitations:redeem:
    post:
      operationId: post_supplier_order_invitations_redeem
      tags: [Supplier portal]
      summary: Resgatar convite restrito a um pedido
      security: []
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [token], properties: {token: {type: string, minLength: 32}}}}}
      responses:
        '200':
          description: Contexto sem permissão de escrita antes de OTP
          content: {application/json: {schema: {$ref: '#/components/schemas/OrderInvitationContext'}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/supplier/quotations/{quotationId}:
    get:
      operationId: get_supplier_quotations_quotationId
      tags: [Supplier portal]
      summary: Ler apenas a cotação da participação autorizada
      security: [{supplierBearer: []}]
      parameters: [{$ref: '#/components/parameters/QuotationId'}]
      responses:
        '200':
          description: Itens e oferta da própria organização
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/SupplierQuotation'}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/supplier/quotations/{quotationId}/offer:
    put:
      operationId: put_supplier_quotations_quotationId_offer
      tags: [Supplier portal]
      summary: Salvar cabeçalho comercial da proposta
      security: [{supplierBearer: []}]
      parameters: [{$ref: '#/components/parameters/QuotationId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CommercialTerms'}}}
      responses:
        '200': {$ref: '#/components/responses/OfferChanged'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/supplier/quotations/{quotationId}/offer-items:bulk:
    put:
      operationId: put_supplier_quotations_quotationId_offer_items_bulk
      tags: [Supplier portal]
      summary: Salvar até 500 linhas em uma versão atômica da oferta
      description: |
        Validação aponta linhas erradas; nenhuma linha é gravada se houver erro.
        A organização fornecedora vem da sessão individual. supplier_id no corpo
        é rejeitado como campo desconhecido; não altera o escopo.
      security: [{supplierBearer: []}]
      parameters: [{$ref: '#/components/parameters/QuotationId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
