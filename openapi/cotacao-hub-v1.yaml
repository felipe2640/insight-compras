        aggregate: {type: object, additionalProperties: false, required: [type, id, version], properties: {type: {type: string}, id: {$ref: '#/components/schemas/Id'}, version: {type: integer, minimum: 1}}}
        payload: {type: object}
      description: Envelope sem token, OTP, PIN, endereço privado, dados pessoais de contato ou URL assinada.
