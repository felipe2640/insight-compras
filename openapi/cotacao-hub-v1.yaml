        code: {type: string, enum: [invalid_request, invalid_token, invalid_otp, expired_otp, invitation_expired, invitation_revoked, invitation_replayed, resource_not_found, insufficient_scope, tenant_mismatch, supplier_mismatch, idempotency_key_conflict, version_conflict, precondition_required, quotation_closed, duplicate_issue, quotation_has_issued_orders, webhook_replay, rate_limited, domain_violation], example: version_conflict}
        detail: {type: string}
        request_id: {type: string}
        resource_version: {type: integer}
        invalid_params: {type: array, items: {type: object, required: [name, reason], properties: {name: {type: string}, reason: {type: string}, row_number: {type: integer}}}}
