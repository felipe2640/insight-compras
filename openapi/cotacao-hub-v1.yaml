        nesse tenant. Conhecer documentId não autoriza acesso. Resposta a recurso
        invisível é 404 resource_not_found. URL assinada é específica para documento,
        método GET e ator, expira em 5 min e não permite enumeração.
      security: [{bearerAuth: ['order:read']}, {supplierBearer: []}]
      parameters: [{name: documentId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}]
      responses:
        '200':
          description: URL curta com escopo, sujeita a autorização na emissão
          content: {application/json: {schema: {$ref: '#/components/schemas/DocumentDownload'}}}
          headers:
            Cache-Control: {schema: {type: string, const: 'private, no-store'}, description: Resposta privada sem cache compartilhado}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/webhook-subscriptions:
    get:
      operationId: get_webhook_subscriptions
      tags: [Integrations]
      summary: Listar apenas assinaturas do tenant
      security: [{bearerAuth: ['integration:manage']}]
      responses:
        '200':
          description: Assinaturas
          content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/WebhookSubscription'}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: post_webhook_subscriptions
      tags: [Integrations]
      summary: Registrar webhook HTTPS para eventos filtrados
      description: URL é validada contra SSRF; sem redirects. Segredo retorna uma vez.
      security: [{bearerAuth: ['integration:manage']}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/WebhookSubscriptionCreate'}}}
      responses:
        '201':
          description: Assinatura criada
          content: {application/json: {schema: {$ref: '#/components/schemas/WebhookSubscriptionCreated'}}}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/events:
    get:
      operationId: get_events
      tags: [Integrations]
      summary: Ler eventos do tenant para reconciliação de webhook
      description: Cursor opaco vinculado ao tenant e filtro, retenção publicada; cursor de outro tenant retorna 404 sem dados.
      security: [{bearerAuth: ['event:read']}]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {name: type, in: query, schema: {type: string}}]
      responses:
        '200':
          description: Eventos versionados
          content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/EventEnvelope'}}, next_cursor: {type: [string, 'null']}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/usage:
    get:
      operationId: get_usage
      tags: [Integrations]
      summary: Entitlement e contadores idempotentes do tenant
      security: [{bearerAuth: ['usage:read']}]
      responses:
        '200':
          description: Uso corrente
          content: {application/json: {schema: {$ref: '#/components/schemas/Usage'}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
webhooks:
  eventNotification:
    post:
      operationId: post_eventNotification
      summary: Entrega de evento ao assinante
      description: |
        At least once. Verificar HMAC-SHA256 sobre timestamp + '.' + event_id + '.' + bytes exatos do corpo.
        Rejeitar timestamp fora da janela de cinco minutos e deduplicar event_id. Segredos rotacionáveis por key id.
      parameters:
        - {name: X-Hub-Event-Id, in: header, required: true, schema: {type: string}}
        - {name: X-Hub-Timestamp, in: header, required: true, schema: {type: string}}
        - {name: X-Hub-Key-Id, in: header, required: true, schema: {type: string}}
        - {name: X-Hub-Signature, in: header, required: true, schema: {type: string, example: 'sha256=hex-digest'}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/EventEnvelope'}}}
      responses:
        '204': {description: Aceito; qualquer 2xx confirma entrega}
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /api/v1/oauth/token
          scopes:
            'supplier:read': Ler relações
            'supplier:manage': Gerir relações
            'quotation:read': Ler cotações
            'quotation:write': Criar e editar rascunhos
            'quotation:manage': Abrir e fechar
            'invitation:write': Convidar
            'award:read': Ler políticas e cortes
            'award:write': Calcular e ajustar
            'award:approve': Aprovar
            'order:read': Ler pedidos
            'order:write': Preparar pedidos
            'order:issue': Emitir
            'import:read': Ler staging
            'import:write': Importar
            'integration:manage': Gerir webhooks
            'event:read': Conciliar eventos
            'usage:read': Ler uso
            'portal:launch': Abrir portal
    clientBasic: {type: http, scheme: basic}
    hubBuyerSession:
      type: apiKey
      in: cookie
      name: hub_session
      description: Sessão individual buyer emitida pelo Hub; mutações exigem CSRF verificado.
    trustedIdentityAssertion:
      type: apiKey
      in: header
      name: X-Hub-Identity-Assertion
      description: JWT assinado de IdP registrado, com iss/aud/sub/exp/jti/nonce e vínculo de tenant; só válido junto à credencial da aplicação.
    supplierBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Sessão de pessoa física identificada, vinculada a uma única participação ou pedido; supplier M2M fora do MVP.
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}, description: 'Retida por no mínimo 72 h; mesmo payload reproduz resposta original, payload diferente retorna 409 idempotency_key_conflict'}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string}, description: ETag opaca recebida em GET ou última mutação}
    Cursor: {name: cursor, in: query, schema: {type: string}, description: Cursor opaco}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    SupplierId: {name: supplierId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    QuotationId: {name: quotationId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    AwardRunId: {name: awardRunId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    OrderId: {name: orderId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ImportId: {name: importId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
  headers:
    ETag: {description: Versão opaca do recurso, schema: {type: string, example: '"v3"'}}
  responses:
    QuotationChanged:
      description: Cotação alterada
      headers: {ETag: {$ref: '#/components/headers/ETag'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Quotation'}}}
    OfferChanged:
      description: Oferta alterada
      headers: {ETag: {$ref: '#/components/headers/ETag'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Offer'}}}
    OrderChanged:
      description: Pedido alterado
      headers: {ETag: {$ref: '#/components/headers/ETag'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseOrder'}}}
    BadRequest: {description: Requisição inválida, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Unauthorized: {description: Autenticação ausente ou inválida, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Forbidden: {description: Escopo insuficiente, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    NotFound: {description: Inexistente ou invisível ao ator, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Gone: {description: Convite ou OTP expirado ou revogado, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Conflict: {description: 'Estado, idempotência ou referência externa em conflito', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    PreconditionFailed: {description: ETag divergente, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Unprocessable: {description: Regra de domínio violada, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    PreconditionRequired: {description: If-Match ausente, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    RateLimited: {description: Limite de taxa, headers: {Retry-After: {schema: {type: integer}}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    TooLarge: {description: Arquivo excede limite, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  x-problem-codes:
    400: [invalid_request]
    401: [invalid_token, invalid_otp]
    403: [insufficient_scope, tenant_mismatch, supplier_mismatch]
    404: [resource_not_found]
    409: [idempotency_key_conflict, quotation_closed, duplicate_issue, quotation_has_issued_orders, webhook_replay]
    410: [expired_otp, invitation_expired, invitation_revoked, invitation_replayed]
    412: [version_conflict]
    422: [domain_violation]
    428: [precondition_required]
    429: [rate_limited]
  schemas:
    Id: {type: string, format: uuid, example: 11111111-1111-4111-8111-111111111111}
    Decimal: {type: string, pattern: '^(0|[1-9][0-9]{0,13})(\.[0-9]{1,6})?$', example: '10.500000', description: 'DECIMAL(20,6) positivo ou zero; sinal negativo apenas em ajustes tipados'}
    Currency: {type: string, pattern: '^[A-Z]{3}$', example: BRL}
    QuotationStatus: {type: string, enum: [draft, open, closed_for_responses, awarded, ordered, cancelled]}
    ExternalRef:
      type: object
      additionalProperties: false
      required: [source_system, external_id]
      properties:
        source_system: {type: string, minLength: 1, maxLength: 80}
        external_id: {type: string, minLength: 1, maxLength: 255, description: Valor opaco}
    Contact:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, maxLength: 200}
        email: {type: string, format: email}
        phone: {type: string, pattern: '^\+[1-9][0-9]{1,14}$'}
    SupplierCreate:
      type: object
      additionalProperties: false
      required: [legal_name, contacts]
      properties:
        legal_name: {type: string, minLength: 1, maxLength: 250}
        tax_identifier: {type: string, maxLength: 32}
        contacts: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Contact'}}
        external_refs: {type: array, items: {$ref: '#/components/schemas/ExternalRef'}}
    SupplierRelationshipUpdate:
      type: object
      additionalProperties: false
      properties:
        status: {type: string, enum: [active, suspended]}
        contacts: {type: array, items: {$ref: '#/components/schemas/Contact'}}
        external_refs: {type: array, items: {$ref: '#/components/schemas/ExternalRef'}}
        commercial_defaults: {$ref: '#/components/schemas/CommercialTerms'}
        private_note: {type: string, maxLength: 2000}
    SupplierRelationship:
      type: object
      required: [id, legal_name, status, contacts, version]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        legal_name: {type: string}
        tax_identifier: {type: [string, 'null']}
        status: {type: string, enum: [active, suspended]}
        contacts: {type: array, items: {$ref: '#/components/schemas/Contact'}}
        external_refs: {type: array, items: {$ref: '#/components/schemas/ExternalRef'}}
        commercial_defaults: {$ref: '#/components/schemas/CommercialTerms'}
        version: {type: integer, minimum: 1}
    Destination:
      type: object
      additionalProperties: false
      required: [external_id, name, address]
      properties:
        external_id: {type: string, description: ID opaco da filial/destino}
        name: {type: string}
        address: {type: string}
    BuyerSnapshot:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string}
        tax_identifier: {type: string}
        address: {type: string}
    QuotationItemInput:
      type: object
      additionalProperties: false
      required: [external_id, description, requested_quantity, requested_unit, destination_external_id]
      properties:
        external_id: {type: string, minLength: 1}
        description: {type: string, minLength: 1, maxLength: 500}
        requested_reference: {type: string, maxLength: 200}
        requested_brand: {type: string, maxLength: 200}
        accepted_brands: {type: array, items: {type: string}}
        requested_quantity: {$ref: '#/components/schemas/Decimal'}
        requested_unit: {type: string, minLength: 1, maxLength: 40}
        destination_external_id: {type: string}
        source_snapshot: {type: object, additionalProperties: true, description: Metadados sanitizados; não usados pelo motor sem contrato tipado}
    QuotationItem:
      type: object
      description: DTO de resposta extensível; clientes devem ignorar campos desconhecidos.
      required:
      - external_id
      - description
      - requested_quantity
      - requested_unit
      - destination_external_id
      - id
      properties:
        external_id:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
          maxLength: 500
        requested_reference:
          type: string
          maxLength: 200
        requested_brand:
          type: string
          maxLength: 200
        accepted_brands:
          type: array
          items:
            type: string
        requested_quantity:
          $ref: '#/components/schemas/Decimal'
        requested_unit:
          type: string
          minLength: 1
          maxLength: 40
        destination_external_id:
          type: string
        source_snapshot:
          type: object
          additionalProperties: true
          description: Metadados sanitizados; não usados pelo motor sem contrato tipado
        id:
          $ref: '#/components/schemas/Id'
    QuotationCreate:
      type: object
      additionalProperties: false
      required: [source_system, external_id, currency, response_deadline_at, buyer_snapshot, destinations, items]
      properties:
        source_system: {type: string}
        external_id: {type: string}
        currency: {$ref: '#/components/schemas/Currency'}
        response_deadline_at: {type: string, format: date-time}
        buyer_snapshot: {$ref: '#/components/schemas/BuyerSnapshot'}
        destinations: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Destination'}}
        items: {type: array, minItems: 1, maxItems: 1000, items: {$ref: '#/components/schemas/QuotationItemInput'}}
    Quotation:
      type: object
      required: [id, status, version, revision, currency, response_deadline_at, buyer_snapshot, destinations, items]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        status: {$ref: '#/components/schemas/QuotationStatus'}
        version: {type: integer, minimum: 1}
        revision: {type: integer, minimum: 1}
        currency: {$ref: '#/components/schemas/Currency'}
        response_deadline_at: {type: string, format: date-time}
        buyer_snapshot: {$ref: '#/components/schemas/BuyerSnapshot'}
        destinations: {type: array, items: {$ref: '#/components/schemas/Destination'}}
        items: {type: array, items: {$ref: '#/components/schemas/QuotationItem'}}
        external_refs: {type: array, items: {$ref: '#/components/schemas/ExternalRef'}}
    InvitationCreate:
      type: object
      additionalProperties: false
      required: [supplier_id, recipients, delivery_mode, expires_at]
      properties:
        supplier_id: {$ref: '#/components/schemas/Id'}
        recipients: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Contact'}}
        delivery_mode: {type: string, enum: [email, manual]}
        expires_at: {type: string, format: date-time}
    InvitationResult:
      type: object
      required: [invitation_ids, delivery_status]
      properties:
        invitation_ids: {type: array, items: {$ref: '#/components/schemas/Id'}}
        delivery_status: {type: string, enum: [queued, manual, failed]}
        manual_links: {type: array, description: Só para entrega manual e só nesta resposta, items: {type: string, format: uri}}
    InvitationContext:
      type: object
      required: [challenge_context_id, quotation_id, supplier_id, permitted_channel]
      properties:
        challenge_context_id: {$ref: '#/components/schemas/Id'}
        quotation_id: {$ref: '#/components/schemas/Id'}
        supplier_id: {$ref: '#/components/schemas/Id'}
        permitted_channel: {type: string, enum: [email, phone]}
    OrderInvitationContext:
      type: object
      required: [order_invitation_context_id, order_id, supplier_id, permitted_channel]
      properties:
        order_invitation_context_id: {$ref: '#/components/schemas/Id'}
        order_id: {$ref: '#/components/schemas/Id'}
        supplier_id: {$ref: '#/components/schemas/Id'}
        permitted_channel: {type: string, enum: [email, phone]}
    Challenge:
      type: object
      required: [challenge_id, expires_at]
      properties:
        challenge_id: {$ref: '#/components/schemas/Id'}
        expires_at: {type: string, format: date-time}
    SupplierSession:
      type: object
      required: [access_token, actor_id, supplier_id, permissions, expires_at]
      properties:
        access_token: {type: string}
        actor_id: {$ref: '#/components/schemas/Id'}
        supplier_id: {$ref: '#/components/schemas/Id'}
        quotation_id: {$ref: '#/components/schemas/Id'}
        order_id: {$ref: '#/components/schemas/Id'}
        permissions: {type: array, items: {type: string, enum: [offer:read, offer:write, offer:submit, order:read, order:respond]}}
        expires_at: {type: string, format: date-time}
    PaymentTerms:
      type: object
      additionalProperties: false
      required: [description]
      properties:
        code: {type: string}
        description: {type: string}
        installments: {type: integer, minimum: 1}
    FreightTerms:
      type: object
      additionalProperties: false
      required: [mode, payer]
      properties:
        mode: {type: string, enum: [CIF, FOB, included, fixed, unknown]}
        payer: {type: string, enum: [buyer, supplier, unknown]}
        amount_kind: {type: string, enum: [fixed, unknown]}
        amount: {$ref: '#/components/schemas/Decimal'}
    Adjustment:
      type: object
      additionalProperties: false
      required: [kind, scope, amount]
      properties:
        kind: {type: string, enum: [discount, surcharge]}
        scope: {type: string, enum: [per_unit, per_order]}
        amount: {$ref: '#/components/schemas/Decimal'}
        note: {type: string}
    CommercialTerms:
      type: object
      additionalProperties: false
      required: [currency, payment_terms, freight_terms]
      properties:
        currency: {$ref: '#/components/schemas/Currency'}
        payment_terms: {$ref: '#/components/schemas/PaymentTerms'}
        minimum_order_amount: {$ref: '#/components/schemas/Decimal'}
        minimum_scope: {type: string, enum: [per_order, per_destination]}
        freight_terms: {$ref: '#/components/schemas/FreightTerms'}
        default_lead_time_days: {type: integer, minimum: 0}
        offer_valid_until: {type: string, format: date-time}
        adjustments: {type: array, items: {$ref: '#/components/schemas/Adjustment'}}
        commercial_note: {type: string}
    PriceBasis:
      type: object
      additionalProperties: false
      required: [currency, priced_unit, tax_status, freight_status, discounts_applied]
      properties:
        currency: {$ref: '#/components/schemas/Currency'}
        priced_unit: {type: string}
        tax_status: {type: string, enum: [included, excluded_with_amount, excluded_unknown]}
        tax_amount: {$ref: '#/components/schemas/Decimal'}
        freight_status: {type: string, enum: [included, separate_known, unknown]}
        discounts_applied: {type: string, enum: ['yes', no_known, unknown]}
        unit_conversion:
          type: object
          additionalProperties: false
          required: [numerator, denominator, policy_version]
          properties:
            numerator: {$ref: '#/components/schemas/Decimal'}
            denominator: {$ref: '#/components/schemas/Decimal'}
            policy_version: {type: string}
    OfferItemInput:
      type: object
      additionalProperties: false
      required: [quotation_item_id, no_stock]
      properties:
        quotation_item_id: {$ref: '#/components/schemas/Id'}
        offered_reference: {type: string}
        offered_brand: {type: string}
        available_quantity: {$ref: '#/components/schemas/Decimal'}
        unit_price: {$ref: '#/components/schemas/Decimal'}
        price_basis: {$ref: '#/components/schemas/PriceBasis'}
        sales_unit: {type: string}
        minimum_quantity: {$ref: '#/components/schemas/Decimal'}
        sales_multiple: {$ref: '#/components/schemas/Decimal'}
        lead_time_days: {type: integer, minimum: 0}
        estimated_delivery_at: {type: string, format: date-time}
        no_stock: {type: boolean}
        substitution_type: {type: string, enum: [none, reference, brand, both]}
        substitution_note: {type: string}
        note: {type: string}
      description: 'Se no_stock=true, available_quantity=0 e unit_price ausente. Caso contrário, quantidade e preço positivos e price_basis obrigatório.'
    OfferItem:
      type: object
      description: DTO de resposta extensível; clientes devem ignorar campos desconhecidos.
      required:
      - quotation_item_id
      - no_stock
      - requested_reference
      - requested_brand
      - requested_quantity
      - requested_unit
      properties:
        quotation_item_id:
          $ref: '#/components/schemas/Id'
        offered_reference:
          type: string
        offered_brand:
          type: string
        available_quantity:
          $ref: '#/components/schemas/Decimal'
        unit_price:
          $ref: '#/components/schemas/Decimal'
        price_basis:
          $ref: '#/components/schemas/PriceBasis'
        sales_unit:
          type: string
        minimum_quantity:
          $ref: '#/components/schemas/Decimal'
        sales_multiple:
          $ref: '#/components/schemas/Decimal'
        lead_time_days:
          type: integer
          minimum: 0
        estimated_delivery_at:
          type: string
          format: date-time
        no_stock:
          type: boolean
        substitution_type:
          type: string
          enum:
          - none
          - reference
          - brand
          - both
        substitution_note:
          type: string
        note:
          type: string
        requested_reference:
          type:
          - string
          - 'null'
        requested_brand:
          type:
          - string
          - 'null'
        requested_quantity:
          $ref: '#/components/schemas/Decimal'
        requested_unit:
          type: string
    Offer:
      type: object
      required: [supplier_id, status, version, origin, items]
      properties:
        supplier_id: {$ref: '#/components/schemas/Id'}
        status: {type: string, enum: [draft, submitted, superseded]}
        version: {type: integer, minimum: 1}
        origin: {type: string, enum: [authenticated_supplier, assisted_unconfirmed, assisted_confirmed]}
        actor_id: {$ref: '#/components/schemas/Id'}
        terms: {$ref: '#/components/schemas/CommercialTerms'}
        items: {type: array, items: {$ref: '#/components/schemas/OfferItem'}}
        evidence_file_sha256: {type: string}
        on_behalf_of_supplier_id: {$ref: '#/components/schemas/Id'}
        recorded_at: {type: string, format: date-time}
        source: {type: string, enum: [portal, xlsx, buyer_entry, supplier_confirmation]}
        supplier_confirmation_status: {type: string, enum: [not_required, pending, confirmed]}
      description: assisted_unconfirmed conserva operador real e fornecedor representado; somente confirmação individual do supplier gera assisted_confirmed.
    SupplierQuotation:
      type: object
      required: [quotation, offer]
      properties:
        quotation: {$ref: '#/components/schemas/Quotation'}
        offer: {$ref: '#/components/schemas/Offer'}
    OfferSubmission:
      type: object
      required: [submitted_revision_id, submitted_at, pending_item_ids, offer]
      properties:
        submitted_revision_id: {$ref: '#/components/schemas/Id'}
        submitted_at: {type: string, format: date-time}
        pending_item_ids: {type: array, items: {$ref: '#/components/schemas/Id'}}
        offer: {$ref: '#/components/schemas/Offer'}
    ImportIssue:
      type: object
      required: [row_number, code, message]
      properties:
        row_number: {type: integer}
        code: {type: string}
        message: {type: string}
        candidate_item_ids: {type: array, items: {$ref: '#/components/schemas/Id'}}
    ImportJob:
      type: object
      required: [id, status, supplier_id, quotation_id, file_sha256, origin, issues, preview]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        status: {type: string, enum: [uploaded, staging, validating, preview, committed, failed]}
        supplier_id: {$ref: '#/components/schemas/Id'}
        quotation_id: {$ref: '#/components/schemas/Id'}
        file_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        origin: {type: string, enum: [authenticated_supplier, assisted_unconfirmed]}
        issues: {type: array, items: {$ref: '#/components/schemas/ImportIssue'}}
        preview: {type: array, items: {$ref: '#/components/schemas/OfferItemInput'}}
        version: {type: integer}
    AwardPolicy:
      type: object
      required: [id, version, strategy_id, strategy_version, minimum_order_mode, assisted_response_mode, brand_policy, allow_overbuy, rounding]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        version: {type: string}
        strategy_id: {type: string}
        strategy_version: {type: string}
        minimum_order_mode: {type: string, enum: [ignore, warning, hard_constraint], description: 'Avaliado por fornecedor × destino × moeda, nunca por linha'}
        assisted_response_mode: {type: string, enum: [exclude, allow_with_warning, require_confirmation]}
        brand_policy: {type: string, enum: [exact_only, accepted_brands, allow_review]}
        allow_overbuy: {type: boolean, description: 'Se false, acquisition_quantity não pode superar saldo solicitado; se true, excedente e custo ficam explícitos'}
        split_allowed: {type: boolean}
        rounding: {type: string, enum: [HALF_UP]}
        rules: {type: object, additionalProperties: true, description: Snapshot versionado; só regras tipadas implementadas entram na decisão}
    AwardAllocation:
      type: object
      required: [id, quotation_item_id, supplier_id, allocated_quantity, acquisition_quantity, unit_price, goods_cost, comparison_status, reason_codes]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        quotation_item_id: {$ref: '#/components/schemas/Id'}
        supplier_id: {$ref: '#/components/schemas/Id'}
        allocated_quantity: {$ref: '#/components/schemas/Decimal'}
        acquisition_quantity: {$ref: '#/components/schemas/Decimal'}
        unit_price: {$ref: '#/components/schemas/Decimal'}
        goods_cost: {$ref: '#/components/schemas/Decimal'}
        landed_cost: {$ref: '#/components/schemas/Decimal'}
        comparison_status: {type: string, enum: [comparable, requires_review]}
        reason_codes: {type: array, items: {type: string}}
        tie_break: {type: array, items: {type: string}}
        payment_terms: {$ref: '#/components/schemas/PaymentTerms'}
        lead_time_days: {type: integer}
    AwardCandidate:
      type: object
      required: [quotation_item_id, supplier_id, eligibility_status, reason_codes]
      properties:
        quotation_item_id: {$ref: '#/components/schemas/Id'}
        supplier_id: {$ref: '#/components/schemas/Id'}
        nominal_unit_price: {$ref: '#/components/schemas/Decimal'}
        eligibility_status: {type: string, enum: [eligible, ineligible, requires_review]}
        reason_codes: {type: array, items: {type: string}}
    AwardItemComparison:
      type: object
      required: [quotation_item_id, comparison_status]
      properties:
        quotation_item_id: {$ref: '#/components/schemas/Id'}
        lowest_unit_price: {$ref: '#/components/schemas/Decimal'}
        comparison_status: {type: string, enum: [comparable, requires_review, no_eligible_offer]}
        reason_codes: {type: array, items: {type: string}}
    SupplierDestinationScenario:
      type: object
      additionalProperties: false
      required: [supplier_id, destination_external_id, currency, allocations, goods_subtotal, minimum_order_mode, minimum_order_amount, minimum_status, freight_status, comparison_status, scenario_feasibility, violations, alerts, non_comparable_fields]
      properties:
        supplier_id: {$ref: '#/components/schemas/Id'}
        destination_external_id: {type: string}
        currency: {$ref: '#/components/schemas/Currency'}
        allocations: {type: array, items: {$ref: '#/components/schemas/AwardAllocation'}}
        goods_subtotal: {$ref: '#/components/schemas/Decimal'}
        acquired_quantity: {$ref: '#/components/schemas/Decimal'}
        freight_mode: {type: string, enum: [CIF, FOB, included, fixed, unknown]}
        freight_status: {type: string, enum: [known, unknown, not_applicable]}
        freight_known_amount: {$ref: '#/components/schemas/Decimal'}
        minimum_order_amount: {$ref: '#/components/schemas/Decimal'}
        minimum_order_mode: {type: string, enum: [ignore, warning, hard_constraint]}
        minimum_status: {type: string, enum: [met, ignored, warning, violated]}
        commercial_known_total: {$ref: '#/components/schemas/Decimal'}
        comparison_status: {type: string, enum: [comparable, requires_review]}
        scenario_feasibility: {type: string, enum: [feasible, warning, requires_review, infeasible]}
        violations: {type: array, items: {type: string}}
        alerts: {type: array, items: {type: string}}
        non_comparable_fields: {type: array, items: {type: string}}
      allOf:
        - if: {properties: {freight_status: {const: unknown}}}
          then: {properties: {comparison_status: {const: requires_review}}}
        - if: {properties: {minimum_order_mode: {const: hard_constraint}, minimum_status: {const: violated}}}
          then: {properties: {scenario_feasibility: {const: infeasible}}}
      description: Frete desconhecido exige comparação requires_review. Se também houver violação hard conhecida, scenario_feasibility é infeasible; caso contrário requires_review. Não há rateio arbitrário por item.
    SuggestedAward:
      type: object
      additionalProperties: false
      required: [strategy_id, strategy_version, allocation_ids, scenario_feasibility, reason_codes]
      properties:
        strategy_id: {type: string}
        strategy_version: {type: string}
        allocation_ids: {type: array, items: {$ref: '#/components/schemas/Id'}}
        scenario_feasibility: {type: string, enum: [feasible, warning, requires_review, infeasible]}
        reason_codes: {type: array, items: {type: string}}
      description: Resultado da estratégia; menor preço unitário não implica melhor cenário comercial.
    AwardRun:
      type: object
      required: [id, quotation_id, status, version, input_hash, result_hash, input_schema_version, policy, strategy_artifact_digest, item_comparisons, candidates, allocations, pending_items, supplier_destination_scenarios, suggested_award, alerts, rules_applied, rules_ignored]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        quotation_id: {$ref: '#/components/schemas/Id'}
        parent_run_id: {$ref: '#/components/schemas/Id'}
        status: {type: string, enum: [computed, approved, rejected, superseded]}
        version: {type: integer, minimum: 1}
        input_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        result_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        input_schema_version: {type: string}
        strategy_artifact_digest: {type: string}
        policy: {$ref: '#/components/schemas/AwardPolicy'}
        item_comparisons: {type: array, items: {$ref: '#/components/schemas/AwardItemComparison'}}
        candidates: {type: array, items: {$ref: '#/components/schemas/AwardCandidate'}}
        allocations: {type: array, items: {$ref: '#/components/schemas/AwardAllocation'}}
        pending_items: {type: array, items: {type: object, required: [quotation_item_id, remaining_quantity, reason_codes], properties: {quotation_item_id: {$ref: '#/components/schemas/Id'}, remaining_quantity: {$ref: '#/components/schemas/Decimal'}, reason_codes: {type: array, items: {type: string}}}}}
        supplier_destination_scenarios: {type: array, items: {$ref: '#/components/schemas/SupplierDestinationScenario'}}
        suggested_award: {$ref: '#/components/schemas/SuggestedAward'}
        alerts: {type: array, items: {type: object, required: [code, message], properties: {code: {type: string}, message: {type: string}}}}
        rules_applied: {type: array, items: {type: string}}
        rules_ignored: {type: array, items: {type: string}}
        adjustments: {type: array, items: {$ref: '#/components/schemas/AwardAdjustment'}}
    AwardSnapshot:
      type: object
      required: [award_run_id, schema_version, canonicalization, input_hash, strategy_id, strategy_version, strategy_artifact_digest, captured_at, input]
      properties:
        award_run_id: {$ref: '#/components/schemas/Id'}
        schema_version: {type: string}
        canonicalization: {type: string, example: RFC8785}
        input_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        strategy_id: {type: string}
        strategy_version: {type: string}
        strategy_artifact_digest: {type: string}
        captured_at: {type: string, format: date-time}
        input: {type: object, additionalProperties: true, description: 'Snapshot completo de itens, propostas, condições, relacionamento e política; versionado por schema_version'}
    AwardAdjustment:
      type: object
      additionalProperties: false
      required: [quotation_item_id, supplier_id, allocated_quantity, reason, acknowledged_impact_codes]
      properties:
        quotation_item_id: {$ref: '#/components/schemas/Id'}
        supplier_id: {$ref: '#/components/schemas/Id'}
        allocated_quantity: {$ref: '#/components/schemas/Decimal'}
        reason: {type: string, minLength: 3, maxLength: 2000}
        acknowledged_impact_codes: {type: array, items: {type: string}}
    OrderItem:
      type: object
      required: [quotation_item_id, requested_reference, offered_reference, requested_brand, offered_brand, ordered_quantity, unit, unit_price, line_total]
      properties:
        quotation_item_id: {$ref: '#/components/schemas/Id'}
        requested_reference: {type: [string, 'null']}
        offered_reference: {type: [string, 'null']}
        requested_brand: {type: [string, 'null']}
        offered_brand: {type: [string, 'null']}
        ordered_quantity: {$ref: '#/components/schemas/Decimal'}
        unit: {type: string}
        unit_price: {$ref: '#/components/schemas/Decimal'}
        line_total: {$ref: '#/components/schemas/Decimal'}
    PurchaseOrder:
      type: object
      required: [id, number, status, version, quotation_id, award_run_id, buyer_snapshot, supplier_snapshot, destination, currency, items, goods_total, freight_total, total, commercial_terms]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        number: {type: string, example: PO-2026-0000123}
        status: {type: string, enum: [draft, issued, acknowledged, confirmed, declined, cancelled, partially_received, received]}
        version: {type: integer, minimum: 1}
        quotation_id: {$ref: '#/components/schemas/Id'}
        award_run_id: {$ref: '#/components/schemas/Id'}
        buyer_snapshot: {$ref: '#/components/schemas/BuyerSnapshot'}
        supplier_snapshot: {type: object, required: [id, legal_name], properties: {id: {$ref: '#/components/schemas/Id'}, legal_name: {type: string}, tax_identifier: {type: string}}}
        destination: {$ref: '#/components/schemas/Destination'}
        currency: {$ref: '#/components/schemas/Currency'}
        items: {type: array, items: {$ref: '#/components/schemas/OrderItem'}}
        goods_total: {$ref: '#/components/schemas/Decimal'}
        freight_total: {$ref: '#/components/schemas/Decimal'}
        total: {$ref: '#/components/schemas/Decimal'}
        commercial_terms: {$ref: '#/components/schemas/CommercialTerms'}
        external_refs: {type: array, items: {$ref: '#/components/schemas/ExternalRef'}}
        transitions: {type: array, items: {type: object, required: [from, to, at, actor_id], properties: {from: {type: string}, to: {type: string}, at: {type: string, format: date-time}, actor_id: {$ref: '#/components/schemas/Id'}, reason: {type: string}}}}
    Document:
      type: object
      required: [id, order_id, format, status, sha256, template_version]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        order_id: {$ref: '#/components/schemas/Id'}
        format: {type: string, enum: [pdf, xlsx]}
        status: {type: string, enum: [preview, final]}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        template_version: {type: string}
        download_url: {type: string, format: uri, description: URL temporária e restrita}
        expires_at: {type: string, format: date-time}
    DocumentDownload:
      allOf:
        - {$ref: '#/components/schemas/Document'}
        - {type: object, required: [download_url, expires_at]}
    WebhookSubscriptionCreate:
      type: object
      additionalProperties: false
      required: [url, event_types]
      properties:
        url: {type: string, format: uri, pattern: '^https://'}
        event_types: {type: array, minItems: 1, items: {type: string, enum: [quotation.created.v1, offer.submitted.v1, award.approved.v1, purchase_order.created.v1, purchase_order.issued.v1, purchase_order.confirmed.v1, purchase_order.declined.v1, purchase_order.cancelled.v1, purchase_order.partially_received.v1, purchase_order.received.v1]}}
    WebhookSubscription:
      type: object
      description: DTO de resposta extensível; clientes devem ignorar campos desconhecidos.
      required:
      - url
      - event_types
      - id
      - status
      properties:
        url:
          type: string
          format: uri
          pattern: ^https://
        event_types:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - quotation.created.v1
            - offer.submitted.v1
            - award.approved.v1
            - purchase_order.created.v1
            - purchase_order.issued.v1
            - purchase_order.confirmed.v1
            - purchase_order.declined.v1
            - purchase_order.cancelled.v1
            - purchase_order.partially_received.v1
            - purchase_order.received.v1
        id:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum:
          - active
          - paused
        key_id:
          type: string
    WebhookSubscriptionCreated:
      type: object
      description: DTO de resposta extensível; clientes devem ignorar campos desconhecidos.
      required:
      - url
      - event_types
      - id
      - status
      - signing_secret
      properties:
        url:
          type: string
          format: uri
          pattern: ^https://
        event_types:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - quotation.created.v1
            - offer.submitted.v1
            - award.approved.v1
            - purchase_order.created.v1
            - purchase_order.issued.v1
            - purchase_order.confirmed.v1
            - purchase_order.declined.v1
            - purchase_order.cancelled.v1
            - purchase_order.partially_received.v1
            - purchase_order.received.v1
        id:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum:
          - active
          - paused
        key_id:
          type: string
        signing_secret:
          type: string
          description: Retornado apenas uma vez
    EventEnvelope:
      oneOf:
        - {$ref: '#/components/schemas/QuotationCreatedEvent'}
        - {$ref: '#/components/schemas/OfferSubmittedEvent'}
        - {$ref: '#/components/schemas/AwardApprovedEvent'}
        - {$ref: '#/components/schemas/PurchaseOrderCreatedEvent'}
        - {$ref: '#/components/schemas/PurchaseOrderIssuedEvent'}
        - {$ref: '#/components/schemas/PurchaseOrderConfirmedEvent'}
        - {$ref: '#/components/schemas/PurchaseOrderDeclinedEvent'}
        - {$ref: '#/components/schemas/PurchaseOrderCancelledEvent'}
        - {$ref: '#/components/schemas/PurchaseOrderPartiallyReceivedEvent'}
        - {$ref: '#/components/schemas/PurchaseOrderReceivedEvent'}
      discriminator:
        propertyName: event_type
        mapping:
          quotation.created.v1: '#/components/schemas/QuotationCreatedEvent'
          offer.submitted.v1: '#/components/schemas/OfferSubmittedEvent'
          award.approved.v1: '#/components/schemas/AwardApprovedEvent'
          purchase_order.created.v1: '#/components/schemas/PurchaseOrderCreatedEvent'
          purchase_order.issued.v1: '#/components/schemas/PurchaseOrderIssuedEvent'
          purchase_order.confirmed.v1: '#/components/schemas/PurchaseOrderConfirmedEvent'
          purchase_order.declined.v1: '#/components/schemas/PurchaseOrderDeclinedEvent'
          purchase_order.cancelled.v1: '#/components/schemas/PurchaseOrderCancelledEvent'
          purchase_order.partially_received.v1: '#/components/schemas/PurchaseOrderPartiallyReceivedEvent'
          purchase_order.received.v1: '#/components/schemas/PurchaseOrderReceivedEvent'
    EventBase:
      type: object
      required: [event_id, event_type, schema_version, tenant_id, occurred_at, correlation_id, aggregate, payload]
      properties:
        event_id: {$ref: '#/components/schemas/Id'}
        event_type: {type: string}
